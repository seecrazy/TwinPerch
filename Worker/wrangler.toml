name = "twinperch-relay"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# 每对情侣部署到自己的 Cloudflare 账户；DO 必须 SQLite 后端（免费层要求）
# 部署由 App 通过 API 完成（见 docs/04 §4）：migration new_sqlite_classes

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[vars]
# 推送代理（opt-in）；关闭推送时留空即可
PUSH_PROXY_URL = ""
PUSH_PROXY_KEY = ""
# 部署后 /bootstrap 写入房间元数据的防护密钥（App 生成，24 字节 hex）
DEPLOY_KEY = "REPLACE_AT_DEPLOY_BY_APP" 
